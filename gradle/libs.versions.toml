[versions]
kotlin = "2.4.20"
kotlinx = "1.12.0"
shadow = "9.6.1"
resourceFactory = "1.4.0"
runServer = "3.1.0"
mavenPublish = "0.37.0"
paper = "26.3.build.+"

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
resourceFactory = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resourceFactory" }
runServer = { id = "xyz.jpenilla.run-paper", version.ref = "runServer" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

[libraries]
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx" }
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }